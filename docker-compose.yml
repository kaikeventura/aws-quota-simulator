version: '3.8'

services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      - FLOCI_HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  quota-simulator:
    build: .
    ports:
      - "4567:4567"
    environment:
      - UPSTREAM_URL=http://floci:4566
      - QUOTA_SQS_FIFO_TPS=300
      - QUOTA_DYNAMODB_ONDEMAND_MAX_RPS=40000
      - STARTUP_DELAY=5
    depends_on:
      floci:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs

networks:
  default:
    name: aws-quota-network
